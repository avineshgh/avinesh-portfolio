version: "3.8"

services:
  portfolio:
    image: portfolio:latest
    container_name: portfolio_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    expose:
      - "3000"
    networks:
      - portfolio_net

  nginx:
    image: nginx:alpine
    container_name: portfolio_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - portfolio
    networks:
      - portfolio_net

networks:
  portfolio_net:
    driver: bridge
